version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: appbtp-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: appbtp
    volumes:
      - mongodb_data:/data/db
      - ./database/init/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/seed/Dockerfile
    container_name: appbtp-seed
    environment:
      MONGODB_URI: mongodb://appbtp:appbtp123@mongodb:27017/appbtp?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - appbtp-network
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: appbtp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: appbtp-backend
    ports:
      - "8081:8081"
    env_file:
      - .env.dev
    environment:
      MONGODB_URI: mongodb://appbtp:appbtp123@mongodb:27017/appbtp?authSource=admin
      JWT_SECRET: dev-jwt-secret-key-change-in-production-2024
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend/src:/app/src
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: appbtp-worker
    ports:
      - "9090:9090"
    environment:
      MONGODB_URI: mongodb://appbtp:appbtp123@mongodb:27017/appbtp?authSource=admin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      METRICS_PORT: 9090
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  jenkins:
    build:
      context: ./docker/jenkins
    container_name: appbtp-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/workspace/backend:ro
      - ./mobile:/workspace/mobile:ro
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: appbtp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: appbtp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: appbtp-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - appbtp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: appbtp-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - promtail_positions:/run/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - appbtp-network
    restart: unless-stopped

volumes:
  mongodb_data:
  rabbitmq_data:
  backend_uploads:
  backend_logs:
  jenkins_home:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  appbtp-network:
    driver: bridge
