# Modele de Secret Kubernetes.
# Copier en appbtp-secret.yaml (ignore par Git) et remplir les valeurs reelles :
#   cp kubernetes/appbtp-secret.example.yaml kubernetes/appbtp-secret.yaml
#
# En production les valeurs ne sont pas gerees a la main : elles proviennent
# des credentials Jenkins, injectes au deploiement.
apiVersion: v1
kind: Secret
metadata:
  name: appbtp-secrets
  namespace: appbtp
type: Opaque
stringData:
  mongodb-uri: "mongodb://<user>:<password>@mongodb:27017/appbtp?authSource=admin"
  jwt-secret: "<jwt-secret>"
  rabbitmq-url: "amqp://<user>:<password>@rabbitmq:5672"
  mongo-root-user: "<mongo-root-user>"
  mongo-root-password: "<mongo-root-password>"
