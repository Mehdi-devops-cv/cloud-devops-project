apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: appbtp
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: appbtp-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: appbtp-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: appbtp-secrets
              key: jwt-secret
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: appbtp-config
              key: node-env
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: appbtp-config
              key: log-level
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: appbtp-secrets
              key: rabbitmq-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
