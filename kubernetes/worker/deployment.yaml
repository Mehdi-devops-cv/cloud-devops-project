apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: appbtp
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: appbtp-worker:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9090
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: appbtp-secrets
              key: mongodb-uri
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: appbtp-secrets
              key: rabbitmq-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
