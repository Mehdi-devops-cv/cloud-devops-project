groups:
  - name: appbtp-alerts
    rules:
      - alert: BackendDown
        expr: up{job="appbtp-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "AppBTP backend has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(appbtp_api_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "API error rate is above 10% for 2 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(appbtp_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 2 seconds."
