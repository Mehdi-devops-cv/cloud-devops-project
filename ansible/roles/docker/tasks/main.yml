---
- name: Check Docker is installed
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: docker_check.rc != 0

- name: Display Docker version
  debug:
    msg: "Docker version: {{ docker_check.stdout }}"

- name: Check Docker Compose is available
  command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: compose_check.rc != 0

- name: Display Docker Compose version
  debug:
    msg: "Docker Compose version: {{ compose_check.stdout }}"

- name: Check Docker daemon is running
  command: docker info
  register: docker_info
  changed_when: false

- name: Create appbtp network
  community.docker.docker_network:
    name: appbtp-network
    driver: bridge
  ignore_errors: yes

- name: Check all appbtp containers
  command: docker ps -a --filter "name=appbtp" --format "{\{.Names\}} - {\{.Status\}}"
  register: containers
  changed_when: false

- name: Display container status
  debug:
    msg: "{{ containers.stdout_lines }}"
